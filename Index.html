<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTMO Lot Size Calculator</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#0d1422;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
}

.box{
    background:#172238;
    padding:20px;
    border-radius:15px;
}

h1{
    text-align:center;
    font-size:24px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    color:#b8c4d6;
}

input,select{
    width:100%;
    height:48px;
    padding:10px;
    box-sizing:border-box;
    background:#0b1322;
    color:white;
    border:1px solid #3b4b65;
    border-radius:8px;
    font-size:17px;
}

.direction{
    display:flex;
    gap:10px;
}

.direction input{
    display:none;
}

.direction label{
    flex:1;
    text-align:center;
    padding:14px;
    background:#0b1322;
    border:1px solid #3b4b65;
    border-radius:8px;
    cursor:pointer;
}

.direction input:checked + label{
    background:#176b42;
    border-color:#35d58b;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    width:100%;
    margin-top:20px;
    height:52px;
    border:0;
    border-radius:9px;
    background:#268cff;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.result{
    margin-top:20px;
    padding:18px;
    background:#0b1322;
    border-radius:10px;
    text-align:center;
}

.lot{
    font-size:42px;
    font-weight:bold;
    color:#45df96;
    margin:8px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.stat{
    background:#1c2940;
    padding:12px;
    border-radius:8px;
    text-align:left;
}

.stat span{
    display:block;
    color:#9aa9bd;
    font-size:11px;
    margin-bottom:5px;
}

.error{
    display:none;
    margin-top:12px;
    padding:12px;
    background:#632b32;
    border-radius:8px;
    color:white;
}

.note{
    margin-top:15px;
    color:#8492a7;
    font-size:11px;
    line-height:1.5;
}

@media(max-width:450px){
    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>FTMO Lot Size Calculator</h1>

<label>PAIR</label>

<select id="pair">
<option value="EURUSD">EURUSD</option>
<option value="GBPUSD">GBPUSD</option>
<option value="USDJPY">USDJPY</option>
<option value="XAUUSD">XAUUSD</option>
</select>


<label>DIRECTION</label>

<div class="direction">

<input type="radio" id="buy" name="direction" value="BUY" checked>
<label for="buy">BUY</label>

<input type="radio" id="sell" name="direction" value="SELL">
<label for="sell">SELL</label>

</div>


<div class="row">

<div>
<label>ENTRY</label>
<input id="entry" type="number" step="any" placeholder="1.17500">
</div>

<div>
<label>STOP LOSS</label>
<input id="sl" type="number" step="any" placeholder="1.17000">
</div>

</div>


<div class="row">

<div>
<label>TAKE PROFIT</label>
<input id="tp" type="number" step="any" placeholder="1.18500">
</div>

<div>
<label>RISK ($)</label>
<input id="risk" type="number" step="any" placeholder="100">
</div>

</div>


<button type="button" onclick="calculate()">CALCULATE LOT SIZE</button>

<div id="error" class="error"></div>


<div class="result">

<div>LOT SIZE</div>

<div id="lot" class="lot">—</div>

<div class="stats">

<div class="stat">
<span>RISK</span>
<b id="riskResult">—</b>
</div>

<div class="stat">
<span>PROFIT AT TP</span>
<b id="profitResult">—</b>
</div>

<div class="stat">
<span>RISK : REWARD</span>
<b id="rrResult">—</b>
</div>

<div class="stat">
<span>SL DISTANCE</span>
<b id="distanceResult">—</b>
</div>

</div>
</div>


<div class="note">
The lot size is rounded DOWN to 0.01 so the calculated risk does not exceed the selected risk amount.
</div>

</div>
</div>


<script>

function calculate(){

    var error = document.getElementById("error");

    error.style.display = "none";


    var pair = document.getElementById("pair").value;

    var entry = parseFloat(document.getElementById("entry").value);

    var sl = parseFloat(document.getElementById("sl").value);

    var tp = parseFloat(document.getElementById("tp").value);

    var risk = parseFloat(document.getElementById("risk").value);

    var buy = document.getElementById("buy").checked;


    if(
        isNaN(entry) ||
        isNaN(sl) ||
        isNaN(tp) ||
        isNaN(risk) ||
        risk <= 0
    ){

        showError("Please enter Entry, Stop Loss, Take Profit and Risk.");

        return;
    }


    if(buy){

        if(sl >= entry){

            showError("For BUY, Stop Loss must be below Entry.");

            return;
        }

        if(tp <= entry){

            showError("For BUY, Take Profit must be above Entry.");

            return;
        }

    }else{

        if(sl <= entry){

            showError("For SELL, Stop Loss must be above Entry.");

            return;
        }

        if(tp >= entry){

            showError("For SELL, Take Profit must be below Entry.");

            return;
        }
    }


    var slDistance = Math.abs(entry - sl);

    var tpDistance = Math.abs(tp - entry);


    var lossPerLot;

    var profitPerLot;

    var commissionPerLot;


    /*
    EURUSD / GBPUSD

    1 lot = 100,000 units
    */

    if(pair === "EURUSD" || pair === "GBPUSD"){

        lossPerLot = slDistance * 100000;

        profitPerLot = tpDistance * 100000;

        commissionPerLot = 5;

    }


    /*
    USDJPY

    P/L is calculated in JPY
    and converted to USD using USDJPY price.
    */

    if(pair === "USDJPY"){

        lossPerLot = (slDistance * 100000) / entry;

        profitPerLot = (tpDistance * 100000) / entry;

        commissionPerLot = 5;

    }


    /*
    XAUUSD

    1 lot = 100 oz
    */

    if(pair === "XAUUSD"){

        lossPerLot = slDistance * 100;

        profitPerLot = tpDistance * 100;

        commissionPerLot =
            (100 * entry) * 0.000007 * 2;

    }


    var totalRiskPerLot =
        lossPerLot + commissionPerLot;


    var rawLot =
        risk / totalRiskPerLot;


    /*
    Round DOWN to 0.01
    */

    var lot =
        Math.floor(rawLot * 100) / 100;


    if(lot < 0.01){

        showError(
            "The selected risk is too small for 0.01 lot with this Stop Loss."
        );

        return;
    }


    var actualRisk =
        totalRiskPerLot * lot;


    var profit =
        (profitPerLot - commissionPerLot) * lot;


    var rr =
        profit / actualRisk;


    document.getElementById("lot").innerHTML =
        lot.toFixed(2);


    document.getElementById("riskResult").innerHTML =
        "$" + actualRisk.toFixed(2);


    document.getElementById("profitResult").innerHTML =
        "$" + profit.toFixed(2);


    document.getElementById("rrResult").innerHTML =
        "1 : " + rr.toFixed(2);


    if(pair === "EURUSD" || pair === "GBPUSD"){

        document.getElementById("distanceResult").innerHTML =
            slDistance.toFixed(5);

    }else{

        document.getElementById("distanceResult").innerHTML =
            slDistance.toFixed(2);

    }

}


function showError(message){

    var error =
        document.getElementById("error");

    error.innerHTML = message;

    error.style.display = "block";

    document.getElementById("lot").innerHTML = "—";

    document.getElementById("riskResult").innerHTML = "—";

    document.getElementById("profitResult").innerHTML = "—";

    document.getElementById("rrResult").innerHTML = "—";

    document.getElementById("distanceResult").innerHTML = "—";
}

</script>

</body>
</html>
